# QLoRA Fine-Tuning Config — Sarcasm Only
# SHOULD DO run — for the cross-category transfer matrix (Section 15).

base_model: "meta-llama/Llama-3.1-8B-Instruct"
trust_remote_code: false

train_file: "data/training/v2/train_instructions_sarcasm.jsonl"
val_file: "data/training/v2/val_instructions_sarcasm.jsonl"
max_seq_length: 512

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]

load_in_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.5e-4
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
fp16: false
bf16: true
logging_steps: 10
save_steps: 50
eval_steps: 50
eval_strategy: "steps"
save_total_limit: 3
seed: 42

output_dir: "experiments/sarcasm"
experiment_name: "sarcasm_only"
